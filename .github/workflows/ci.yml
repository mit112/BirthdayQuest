name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: the deployment target is iOS 26.0, which requires Xcode 26 or newer.
      # GitHub-hosted runner images may not carry Xcode 26 yet; until they do, the build
      # step below will fail. Check https://github.com/actions/runner-images for current
      # Xcode availability, then pin it explicitly (e.g. /Applications/Xcode_26.app).
      - name: Select newest available Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      # The project uses Xcode folder-synced groups, so GoogleService-Info.plist is not a
      # build input — it is bundled purely by living in the source folder. A placeholder is
      # needed only so FirebaseApp.configure() survives if a test launches the app.
      - name: Stage placeholder Firebase config
        run: cp GoogleService-Info.plist.example BirthdayQuest/BirthdayQuest/GoogleService-Info.plist

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('**/Package.resolved') }}

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project BirthdayQuest/BirthdayQuest.xcodeproj \
            -scheme BirthdayQuest \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project BirthdayQuest/BirthdayQuest.xcodeproj \
            -scheme BirthdayQuest \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath build \
            -skip-testing:BirthdayQuestUITests \
            CODE_SIGNING_ALLOWED=NO \
            test

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: swiftlint lint --strict

  hygiene:
    name: Secret and PII guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secrets or logs tracked
        run: |
          if git ls-files | grep -E 'GoogleService-Info\.plist$|firebase-debug|\.log$'; then
            echo "::error::a secret or log file is tracked"
            exit 1
          fi
      - name: No AI attribution in commits
        run: |
          if git log --format='%B' -20 | grep -iE 'co-authored-by:.*(claude|anthropic|openai|copilot)|generated with'; then
            echo "::error::AI attribution trailer found in recent commits"
            exit 1
          fi

  rules-tests:
    runs-on: ubuntu-latest
    env:
      # Pinned, not floating. The emulators this CLI downloads are what the 113 rules tests were
      # verified against, and with no Cloud Functions these rules carry the entire enforcement
      # burden — a silent emulator upgrade changing rule evaluation is not something to discover
      # from a red build on an unrelated PR.
      FIREBASE_TOOLS_VERSION: '15.8.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firebase-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ~170 MB of JARs, otherwise re-downloaded on every single run. They are versioned by the
      # firebase-tools release that fetches them, so the pin above is the entire cache key.
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ env.FIREBASE_TOOLS_VERSION }}

      - run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      # `ci`, not `install`: it installs exactly what package-lock.json pins and fails if the
      # lockfile is out of sync, rather than silently resolving a newer transitive dependency.
      - run: npm ci
        working-directory: firebase-tests

      - run: npm test
        working-directory: firebase-tests

  integration-tests:
    name: Transaction integration tests
    runs-on: macos-latest
    env:
      # Same pin as rules-tests: the emulator this fetches is what the transaction harness was
      # verified against, and a silent emulator upgrade is not something to discover from a red
      # build on an unrelated PR.
      FIREBASE_TOOLS_VERSION: '15.8.0'
    steps:
      - uses: actions/checkout@v4

      # See the build job: iOS 26.0 needs Xcode 26+, which the hosted image may not carry yet.
      - name: Select newest available Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      # The host app's FirebaseApp.configure() runs at test-host launch; a placeholder plist
      # keeps it from aborting. The emulator itself ignores credentials.
      - name: Stage placeholder Firebase config
        run: cp GoogleService-Info.plist.example BirthdayQuest/BirthdayQuest/GoogleService-Info.plist

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('**/Package.resolved') }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ env.FIREBASE_TOOLS_VERSION }}

      - run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      # Split build from run so the emulator only wraps the fast test execution.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild \
            -project BirthdayQuest/BirthdayQuest.xcodeproj \
            -scheme BirthdayQuest \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      # emulators:exec boots Firestore (open rules from integration-tests/), runs the transaction
      # suite against it, and tears the emulator down. The suite is gated on EmulatorProbe, so it
      # is the ONLY place these tests actually execute — the unit-tests job above skips them.
      #
      # A skip HERE, though, is always a misconfiguration: the emulator is guaranteed up, so a skip
      # means EmulatorProbe's endpoint drifted from the emulator port (both are hardcoded, in
      # separate files), and a skipped Swift Testing suite still exits 0 — a green job proving
      # nothing, while the very regression this harness exists to catch ships undetected. So assert
      # the suite actually ran. The greps are scoped to the suite on purpose: a blanket `skipped`
      # match would false-positive on xcodebuild's own "Metadata extraction skipped" noise.
      - name: Transaction integration tests (Firestore emulator)
        run: |
          set -o pipefail
          firebase --config integration-tests/firebase.json emulators:exec \
            --only firestore --project birthdayquest-test \
            'xcodebuild \
               -project BirthdayQuest/BirthdayQuest.xcodeproj \
               -scheme BirthdayQuest \
               -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=latest" \
               -derivedDataPath build \
               CODE_SIGNING_ALLOWED=NO \
               -only-testing:BirthdayQuestTests/TransactionIntegrationTests test-without-building' \
            2>&1 | tee integration-test-output.log
          if grep -qE "TransactionIntegrationTests[/.][A-Za-z]+\(\).*skipped" integration-test-output.log; then
            echo "::error::Transaction integration suite was SKIPPED — EmulatorProbe did not reach the emulator (port drift between the Swift probe and integration-tests/firebase.json?). Failing rather than passing a green no-op."
            exit 1
          fi
          if ! grep -qE "TransactionIntegrationTests[/.][A-Za-z]+\(\)" integration-test-output.log; then
            echo "::error::No transaction integration test executed (did -only-testing match the suite?)."
            exit 1
          fi
