name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This app is deliberately small. Requests that make forking and customizing easier are
        much more likely to land than requests that add features.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you running into?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
