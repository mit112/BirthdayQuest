included:
  - BirthdayQuest/BirthdayQuest

excluded:
  - BirthdayQuest/BirthdayQuestTests
  - BirthdayQuest/BirthdayQuestUITests
  - build
  - .build

# Rules disabled deliberately, not aspirationally. SwiftUI view bodies and
# Firestore payload dictionaries legitimately trip all of these; enabling them
# would mean restyling working code to satisfy a linter default.
disabled_rules:
  - type_body_length          # SwiftUI views and FirestoreService are long by nature
  - function_body_length
  - file_length
  - line_length
  - trailing_whitespace
  - trailing_comma            # trailing commas in multi-line literals are intentional here
  - large_tuple               # a few 3-tuples used for layout math
  - function_parameter_count  # FirestoreService.completeChallengeAtomically takes 7
  - todo

opt_in_rules:
  - empty_count
  - force_unwrapping
  - redundant_nil_coalescing
  - closure_spacing
  - first_where
  - redundant_discardable_let

analyzer_rules:
  - unused_import

force_cast: error
force_try: error

identifier_name:
  min_length: 2
  excluded: [id, a, b, c, x, y, w, h, t, r, g, b, i, j, k, n, dx, dy, xs, sm, md, lg, xl]
